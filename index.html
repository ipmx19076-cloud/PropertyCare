<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f6f54">
<title>PropertyCare — Kolkata pilot (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<style>
:root{
  --bg:#f5f1ea;--surface:#fffdf9;--surface-2:#efe8dc;--ink:#1d2621;--muted:#5a665f;--line:#ddd4c6;
  --brand:#1f6f54;--brand-2:#e3efe8;--brand-ink:#ffffff;--accent:#b4532a;
  --ok:#1d7447;--ok-bg:#e1f2e7;--warn:#8a5a00;--warn-bg:#fbefd2;--bad:#ac2a20;--bad-bg:#fbe3e0;--info:#22567f;--info-bg:#e2edf7;
  --radius:14px;--shadow:0 1px 2px rgb(30 35 30/.06),0 6px 20px rgb(30 35 30/.06);
  --font:'Inter','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Fraunces',Georgia,'Noto Sans Bengali',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111513;--surface:#181e1b;--surface-2:#222a26;--ink:#e8ede9;--muted:#a1ada6;--line:#2e3833;
    --brand:#58b98f;--brand-2:#1d3029;--brand-ink:#0b1410;--accent:#e58c62;
    --ok:#6fcf98;--ok-bg:#183326;--warn:#e9b955;--warn-bg:#352a12;--bad:#f2928a;--bad-bg:#3a1c1a;--info:#8bbde6;--info-bg:#17293a;
    --shadow:0 1px 2px rgb(0 0 0/.3),0 6px 20px rgb(0 0 0/.25);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111513;--surface:#181e1b;--surface-2:#222a26;--ink:#e8ede9;--muted:#a1ada6;--line:#2e3833;
  --brand:#58b98f;--brand-2:#1d3029;--brand-ink:#0b1410;--accent:#e58c62;
  --ok:#6fcf98;--ok-bg:#183326;--warn:#e9b955;--warn-bg:#352a12;--bad:#f2928a;--bad-bg:#3a1c1a;--info:#8bbde6;--info-bg:#17293a;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 6px 20px rgb(0 0 0/.25);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
h1,h2,h3{font-family:var(--display);font-weight:650;line-height:1.2;margin:0 0 .4em}
h1{font-size:clamp(1.6rem,4vw,2.3rem)}h2{font-size:1.35rem}h3{font-size:1.08rem;font-family:var(--font);font-weight:600}
p{margin:.3em 0 .8em}
.muted{color:var(--muted)}.small{font-size:.85rem}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--surface);padding:8px 12px;border-radius:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:650;font-size:1.15rem;color:var(--ink);text-decoration:none;margin-right:auto}
.brand svg{flex:none}
.brand small{font-family:var(--font);font-weight:500;font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
nav.main{max-width:1120px;margin:0 auto;padding:0 16px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.main a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:7px 12px;border-radius:999px;font-weight:500}
nav.main a[aria-current="page"]{background:var(--brand-2);color:var(--brand)}
.who{display:flex;align-items:center;gap:6px;font-size:.85rem}
main{max-width:1120px;margin:0 auto;padding:20px 16px 60px}
footer{max-width:1120px;margin:0 auto;padding:16px 16px 40px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.85rem;border-radius:8px}
.btn.big{min-height:56px;font-size:1.05rem;padding:12px 18px;border-radius:14px;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{min-width:40px;padding:8px}
.badge-count{background:var(--accent);color:#fff;border-radius:999px;font-size:.7rem;padding:0 6px;min-width:18px;text-align:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}

.banner{border-radius:12px;padding:10px 14px;margin-bottom:14px;border:1px solid var(--line);background:var(--surface-2)}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.banner.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.banner.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.banner.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}

label{display:block;font-weight:600;font-size:.88rem;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px}
textarea{min-height:80px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;min-height:auto;accent-color:var(--brand)}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:500;margin:8px 0}
.hint{font-size:.8rem;color:var(--muted);margin-top:3px}
.fields{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

.prop-card{display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden;padding:0}
.prop-photo{aspect-ratio:16/9;background:var(--surface-2);position:relative;overflow:hidden}
.prop-photo img{width:100%;height:100%;object-fit:cover;display:block}
.prop-photo .stamp{position:absolute;left:8px;bottom:8px;right:8px;background:rgb(0 0 0/.62);color:#fff;font-size:.74rem;padding:5px 8px;border-radius:8px}
.prop-body{padding:14px 16px 16px}
.answer{font-family:var(--display);font-size:1.5rem;margin:.1em 0}
.answer.ok{color:var(--ok)}.answer.warn{color:var(--warn)}.answer.bad{color:var(--bad)}.answer.info{color:var(--info)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:9px 12px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--brand);border-color:var(--brand)}

.photos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.photo{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.photo figcaption{padding:6px 8px;font-size:.72rem;line-height:1.35}
.photo.flagged{border-color:var(--bad)}

table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
.table-wrap{overflow-x:auto}
.num{text-align:right;font-variant-numeric:tabular-nums}

.map{height:240px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);z-index:0}
.map.tall{height:300px}
.map-fallback{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:.85rem;padding:12px}

.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.step{position:relative;padding-left:44px;margin-bottom:16px}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:2px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700}
.step.done::before{content:'✓';background:var(--ok-bg);color:var(--ok)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:52px}
.seg button[aria-pressed="true"].okb{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.seg button[aria-pressed="true"].badb{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.cl-item{padding:10px 0;border-bottom:1px solid var(--line)}

.thread{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding:4px}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--surface-2)}
.msg.mine{align-self:flex-end;background:var(--brand-2)}
.msg .meta{font-size:.72rem;color:var(--muted)}
.offer{border-left:3px solid var(--line);padding:4px 10px;margin:6px 0}
.offer.owner{border-color:var(--info)}.offer.caretaker{border-color:var(--accent)}

.stars{display:flex;gap:4px}
.stars button{font-size:1.6rem;line-height:1;background:none;border:none;cursor:pointer;color:var(--line);padding:4px}
.stars button.on{color:#e0a100}

.modal-back{position:fixed;inset:0;background:rgb(0 0 0/.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgb(0 0 0/.3)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,480px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;box-shadow:var(--shadow);pointer-events:auto}
.toast.bad{background:var(--bad);color:#fff}.toast.warn{background:var(--warn);color:#fff}

.hero{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.hero h1{font-size:clamp(1.9rem,5vw,2.8rem)}
.role-group h3{margin-top:14px}
.user-btn{display:flex;width:100%;text-align:left;justify-content:space-between;gap:10px;margin-bottom:8px;min-height:56px}
.user-btn span small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.stat{font-family:var(--display);font-size:1.8rem;line-height:1}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.demo-panel{border:1px dashed var(--accent);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.demo-panel legend{font-weight:700;color:var(--accent);font-size:.8rem;padding:0 4px}
.lock{font-size:.75rem;color:var(--muted)}
.radar{width:52px;height:52px;border-radius:50%;background:var(--brand-2);position:relative;flex:none}
.radar::before,.radar::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);animation:ping 1.8s ease-out infinite}
.radar::after{animation-delay:.9s}
.radar.done::before,.radar.done::after{animation:none;opacity:0}
@keyframes ping{from{transform:scale(.45);opacity:1}to{transform:scale(1.6);opacity:0}}
.bid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--surface)}
.bid.new{animation:slidein .4s ease-out}
.bid.best{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.bid .amt{font-family:var(--display);font-size:1.35rem;text-align:right;line-height:1.1}
.countdown{font-variant-numeric:tabular-nums;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.radar::before,.radar::after,.bid.new{animation:none}}
@media (max-width:640px){
  .bid{grid-template-columns:minmax(0,1fr) auto}.bid>.av{display:none}
  main{padding:14px 16px 90px}
  .hide-sm{display:none}
  .kv{grid-template-columns:1fr}.kv dt{margin-top:6px}
}
@media print{header.top,nav,footer,.no-print{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   PropertyCare — single-file demo of the MVP.
   Everything runs in this browser; data lives in localStorage.
   "Server" functions below stand in for the real backend: in production
   these checks run on the server, never trust the client.
   Payments are SIMULATED. No real money, SMS, WhatsApp or email.
   ===================================================================== */

const STORE_KEY = 'propertycare-demo-v1';
const IST = 'Asia/Kolkata';
const DAY = 864e5;
let S = null;
let afterRender = [];
let maps = [];
let pendingSignup = null;
const perfBoot = performance.now();

/* ---------------- utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const now = () => Date.now();
const deviceNow = () => now() + (S.demo.clockOffsetMin || 0) * 60000;
function money(minor) { return '₹' + (minor / 100).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
function rupeesToMinor(v) { const n = Math.round(parseFloat(String(v).replace(/[^0-9.]/g, '')) * 100); return Number.isFinite(n) ? n : NaN; }
function fmt(ts, tz) {
  if (!ts) return '—';
  try { return new Intl.DateTimeFormat('en-IN', { timeZone: tz, day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true, timeZoneName: 'short' }).format(new Date(ts)); }
  catch (e) { return new Date(ts).toISOString(); }
}
function fmtDate(ts, tz) { try { return new Intl.DateTimeFormat('en-IN', { timeZone: tz || IST, day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(ts)); } catch (e) { return new Date(ts).toDateString(); } }
/* Owner sees their own time zone with IST alongside; people in India see IST. */
function when(ts, user) {
  user = user || me();
  const tz = (user && user.tz) || IST;
  if (!ts) return '—';
  return tz === IST ? fmt(ts, IST) : `${fmt(ts, tz)} <span class="muted">· ${fmt(ts, IST)}</span>`;
}
function ago(ts) { const d = Math.round((now() - ts) / DAY); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; }
function hash(str) {
  let h1 = 0x811c9dc5, h2 = 0x9747b28c;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); }
  return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
}
function distM(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function offsetPoint(p, meters, bearingDeg) {
  const R = 6371000, br = bearingDeg * Math.PI / 180, la1 = p.lat * Math.PI / 180, lo1 = p.lng * Math.PI / 180, d = meters / R;
  const la2 = Math.asin(Math.sin(la1) * Math.cos(d) + Math.cos(la1) * Math.sin(d) * Math.cos(br));
  const lo2 = lo1 + Math.atan2(Math.sin(br) * Math.sin(d) * Math.cos(la1), Math.cos(d) - Math.sin(la1) * Math.sin(la2));
  return { lat: la2 * 180 / Math.PI, lng: lo2 * 180 / Math.PI };
}
function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m'; }

/* ---------------- i18n (English + Bengali; Hindi keys ready) ---------------- */
const T = {
  en: { home:'Home', addProperty:'Add property', today:"Today's work", earnings:'Earnings', notifications:'Notifications', settings:'Settings', profile:'Profile & verification', signOut:'Sign out',
    isOk:'Your property is OK', attention:'Needs attention', noVisits:'No verified visit yet', lastVisit:'Last verified visit', nextVisit:'Next visit', openTickets:'Open requests',
    checkIn:'Check in at the property', takePhoto:'Take photo', demoCapture:'Demo capture (no camera)', checklist:'Checklist', submitReport:'Submit report', raiseIssue:'Report a problem',
    startVisit:'Start visit', photos:'Photos', accept:'Accept', decline:'Decline', counter:'Counter-offer', startWork:'Start work', uploadProof:'Add proof photo', waitingApproval:'Waiting for admin approval',
    insideArea:'Inside the property area', outsideArea:'Outside the property area', distance:'Distance from pin', due:'Due', ok:'OK', issue:'Problem', note:'Note (optional)', visits:'Visits', tasks:'Repair requests', offers:'New property offers', sync:'Sync now', offline:'Offline' },
  bn: { home:'হোম', addProperty:'সম্পত্তি যোগ করুন', today:'আজকের কাজ', earnings:'আয়', notifications:'বিজ্ঞপ্তি', settings:'সেটিংস', profile:'প্রোফাইল ও যাচাই', signOut:'সাইন আউট',
    isOk:'আপনার সম্পত্তি ঠিক আছে', attention:'নজর দেওয়া দরকার', noVisits:'এখনও যাচাই করা পরিদর্শন হয়নি', lastVisit:'শেষ যাচাই করা পরিদর্শন', nextVisit:'পরের পরিদর্শন', openTickets:'খোলা অনুরোধ',

}

/* ---------------- audit (append-only, hash-chained) ---------------- */
function audit(action, entity, entityId, detail) {
  const u = me();
  const prev = S.audit.length ? S.audit[S.audit.length - 1].hash : '0'.repeat(16);
  const row = { at: now(), actor: u ? u.id : 'system', role: u ? u.role : 'system', action, entity, entityId, detail: detail || '' };
  row.prev = prev;
  row.hash = hash(prev + JSON.stringify([row.at, row.actor, row.action, row.entity, row.entityId, row.detail]));
  S.audit.push(row);
}
function verifyAuditChain() {
  let prev = '0'.repeat(16);
  for (const r of S.audit) {
    if (r.prev !== prev) return false;
    if (r.hash !== hash(prev + JSON.stringify([r.at, r.actor, r.action, r.entity, r.entityId, r.detail]))) return false;
    prev = r.hash;
  }
  return true;
}

/* ---------------- ledger (double entry, integer paise) ----------------
   Sign: + debit, − credit. Every transaction must sum to zero.
   Accounts: gateway (asset at payment gateway), prepaid:<ref> (owner money not yet earned),
   caretaker_held:<id> (earned, held at gateway until payout), dispute_hold:<id>,
   platform_commission (revenue), refunds go back out through gateway. */
function post(kind, ref, entries, memo) {
  const clean = entries.filter(e => e[1] !== 0);
  const sum = clean.reduce((a, e) => a + e[1], 0);
  if (sum !== 0) throw new Error('Ledger imbalance in ' + kind + ': ' + sum);
  if (clean.some(e => !Number.isInteger(e[1]))) throw new Error('Non-integer amount in ' + kind);
  const tx = { id: uid('tx'), at: now(), kind, ref, memo: memo || '', entries: clean.map(([account, amount]) => ({ account, amount })) };
  S.ledger.push(tx);
  audit('ledger.post', 'ledger', tx.id, kind + ' — ' + (memo || ''));
  return tx;
}
function bal(acct) { let b = 0; for (const tx of S.ledger) for (const e of tx.entries) if (e.account === acct) b += e.amount; return b; }
function commissionSplit(amount) { const comm = Math.round(amount * S.config.commissionBp / 10000); return { comm, care: amount - comm }; }
function reconcile() {
  const issues = [];
  const balances = {};
  for (const tx of S.ledger) {
    const s = tx.entries.reduce((a, e) => a + e.amount, 0);
    if (s !== 0) issues.push(`Transaction ${tx.id} sums to ${s}`);
    for (const e of tx.entries) balances[e.account] = (balances[e.account] || 0) + e.amount;
  }
  const total = Object.values(balances).reduce((a, b) => a + b, 0);
  if (total !== 0) issues.push('Trial balance is ' + total + ', expected 0');
  for (const sb of S.subscriptions) if (sb.status === 'cancelled' && (balances['prepaid:' + sb.id] || 0) !== 0) issues.push(`Cancelled plan ${sb.id} still holds ${money(-balances['prepaid:' + sb.id])}`);
  for (const d of S.disputes) if (d.status !== 'open' && (balances['dispute_hold:' + d.id] || 0) !== 0) issues.push(`Resolved dispute ${d.id} still holds funds`);
  for (const [a, v] of Object.entries(balances)) if (a !== 'gateway' && v > 0) issues.push(`Liability/revenue account ${a} has a debit balance ${v}`);
  return { ok: issues.length === 0, issues, balances, total };
}

/* ---------------- photo generation for seed + demo capture ---------------- */
function seededRand(seed) { let x = seed >>> 0 || 1; return () => ((x = Math.imul(x ^ (x >>> 15), 2246822519) + 0x6d2b79f5 >>> 0) % 10000) / 10000; }
function genPhoto(seed, kind) {
  const c = document.createElement('canvas'); c.width = 480; c.height = 360;
  const g = c.getContext('2d'), r = seededRand(seed);
  const sky = g.createLinearGradient(0, 0, 0, 220); sky.addColorStop(0, `hsl(${200 + r() * 20},55%,${62 + r() * 12}%)`); sky.addColorStop(1, '#eef3f0');
  g.fillStyle = sky; g.fillRect(0, 0, 480, 360);
  g.fillStyle = `hsl(${95 + r() * 30},35%,${38 + r() * 10}%)`; g.fillRect(0, 230, 480, 130);
  for (let i = 0; i < 6; i++) { g.fillStyle = `hsl(${100 + r() * 40},40%,${25 + r() * 15}%)`; g.beginPath(); g.arc(r() * 480, 225 + r() * 15, 18 + r() * 26, 0, 7); g.fill(); }
  if (kind !== 'land') {
    const x = 120 + r() * 80, w = 200, h = 120;
    g.fillStyle = `hsl(${20 + r() * 30},${30 + r() * 25}%,${70 + r() * 12}%)`; g.fillRect(x, 240 - h, w, h);
    g.fillStyle = `hsl(${5 + r() * 15},45%,${35 + r() * 10}%)`; g.beginPath(); g.moveTo(x - 14, 240 - h); g.lineTo(x + w / 2, 240 - h - 55); g.lineTo(x + w + 14, 240 - h); g.fill();
    g.fillStyle = '#4b3a2c'; g.fillRect(x + w / 2 - 18, 190, 36, 50);
    g.fillStyle = '#9fc3d6'; g.fillRect(x + 22, 150, 34, 28); g.fillRect(x + w - 56, 150, 34, 28);
  } else {
    g.strokeStyle = '#7a6a55'; g.lineWidth = 3; for (let i = 0; i < 12; i++) { g.beginPath(); g.moveTo(20 + i * 40, 240); g.lineTo(20 + i * 40, 275); g.stroke(); }
    g.beginPath(); g.moveTo(10, 250); g.lineTo(470, 250); g.stroke();
  }
  for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(0,0,0,${r() * .05})`; g.fillRect(r() * 480, r() * 360, 2, 2); }
  return c.toDataURL('image/jpeg', 0.6);
}
function compressFrame(video) {
  const c = document.createElement('canvas'), w = 480;
  const h = Math.round(w * ((video.videoHeight || 360) / (video.videoWidth || 480)));
  c.width = w; c.height = h; c.getContext('2d').drawImage(video, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.6);
}

/* ---------------- domain actions ("server side") ---------------- */
function releaseInstallment(insp, silent) {
  const sb = S.subscriptions.find(s => s.id === insp.subscriptionId);
  if (!sb || sb.released >= sb.installments) return;
  const base = Math.floor(sb.amount / sb.installments);
  const amt = sb.released === sb.installments - 1 ? sb.amount - base * (sb.installments - 1) : base;
  const available = -bal('prepaid:' + sb.id);
  const x = Math.min(amt, available);
  if (x <= 0) return;
  const { comm, care } = commissionSplit(x);
  post('inspection_release', insp.id, [['prepaid:' + sb.id, x], ['caretaker_held:' + insp.caretakerId, -care], ['platform_commission', -comm]], `visit ${insp.id}: caretaker ${money(care)}, commission ${money(comm)}`);
  sb.released++;
  insp.release = { care, comm };
  if (!silent) notify(insp.caretakerId, `Payout milestone eligible: ${money(care)} for your visit.`, '#/earnings');
}
function scheduleNext(p, fromTs) {
  const a = activeAssign(p), sb = subOf(p);
  if (!a || !sb || sb.status !== 'active') return;
  if (nextVisit(p)) return;
  const due = (fromTs || now()) + 30 * DAY;
  S.inspections.push({ id: uid('insp'), propertyId: p.id, assignmentId: a.id, caretakerId: a.caretakerId, subscriptionId: sb.id, dueAt: due, windowEnd: due + 3 * DAY, status: 'scheduled', media: [], checklist: {}, flags: [], attempts: [] });
}
function matchCandidates(p) {
  const sb = subOf(p);
  return S.users.filter(u => u.role === 'caretaker').map(c => {
    const active = S.assignments.filter(a => a.caretakerId === c.id && a.status === 'active').length;
    const free = c.capacity - active;
    const d = c.center ? distM(c.center, p) / 1000 : Infinity;
    const rating = c.ratingCount ? c.ratingSum / c.ratingCount : 0;
    const needs = sb && sb.tier === 'standard' ? ['cleaning', 'minor_repairs'] : [];
    const skillHit = needs.filter(s => c.skills.includes(s)).length;
    const eligible = c.status === 'active' && free > 0 && d <= c.radiusKm;
    const reasons = [];
    if (c.status !== 'active') reasons.push('not approved by admin');
    if (free <= 0) reasons.push('no free capacity');
    if (d > c.radiusKm) reasons.push('outside service area');
    const score = Math.round(rating * 14 + Math.max(0, 25 - d * 2.5) + free * 2 + skillHit * 5);
    return { c, d, free, rating, eligible, reasons, score, explain: `${d.toFixed(1)} km from service centre · rating ${rating ? rating.toFixed(1) : 'new'} · ${free} slot(s) free${needs.length ? ` · ${skillHit}/${needs.length} plan skills` : ''}` };
  }).sort((a, b) => (b.eligible - a.eligible) || (b.score - a.score));
}
/* Integrity checks run on submit (would run on the server). */
function integrityCheck(insp, p) {
  const flags = [];
  const fence = fenceOf(p);
  if (!insp.checkin) flags.push({ code: 'no_checkin', text: 'No check-in recorded' });
  else if (insp.checkin.dist > fence) flags.push({ code: 'outside_geofence', text: `Check-in ${fmtDist(insp.checkin.dist)} from pin (limit ${fence} m)` });
  if (insp.media.length < S.config.minPhotos) flags.push({ code: 'too_few_photos', text: `${insp.media.length} photo(s), minimum ${S.config.minPhotos}` });
  const otherHashes = new Set(S.inspections.filter(i => i.id !== insp.id).flatMap(i => i.media.map(m => m.hash)).concat(S.tickets.flatMap(tk => tk.proof.map(m => m.hash))));
  const seen = new Set();
  const skewMs = S.config.clockSkewMin * 60000;
  for (const m of insp.media) {
    m.flags = [];
    if (m.source !== 'camera' && m.source !== 'demo') m.flags.push('not captured in app');
    if (otherHashes.has(m.hash) || seen.has(m.hash)) m.flags.push('reused photo');
    seen.add(m.hash);
    if (m.dist > fence) m.flags.push(`taken ${fmtDist(m.dist)} from pin`);
    const ref = m.reconstructedAt || m.serverAt;
    if (ref && Math.abs(m.deviceAt - ref) > skewMs) m.flags.push(`device clock off by ${Math.round(Math.abs(m.deviceAt - ref) / 60000)} min`);
    if (m.timeUnverifiable) m.flags.push('offline capture time could not be verified');
  }
  const bad = insp.media.filter(m => m.flags.length);
  if (bad.length) flags.push({ code: 'photo_integrity', text: `${bad.length} photo(s) failed checks: ${[...new Set(bad.flatMap(m => m.flags))].join(', ')}` });
  const items = CHECKLIST_BY_TYPE[p.type];
  if (items.some(k => !insp.checklist[k])) flags.push({ code: 'checklist_incomplete', text: 'Checklist not complete' });
  return flags;
}
function publishInspection(insp, byAdmin) {
  const p = prop(insp.propertyId);
  insp.status = 'published';
  insp.publishedAt = now();
  releaseInstallment(insp);
  const c = user(insp.caretakerId); if (c) c.missed = 0;
  notifyOwners(p, `New verified visit report for “${p.title}”${byAdmin ? ' (approved after review)' : ''}.`, '#/r/' + insp.id);
  const issues = Object.entries(insp.checklist).filter(([, v]) => v === 'issue').map(([k]) => CHECKLIST[k].en);
  if (issues.length) notifyOwners(p, `Visit to “${p.title}” noted problems: ${issues.join(', ')}.`, '#/r/' + insp.id);
  scheduleNext(p, insp.dueAt);
}
function runDailyJobs() {
  const t0 = now(); let missed = 0, lapsed = 0;
  for (const i of S.inspections.filter(i => ['scheduled', 'in_progress'].includes(i.status) && i.windowEnd < t0)) {
    i.status = 'missed'; missed++;
    const p = prop(i.propertyId), c = user(i.caretakerId);
    c.missed = (c.missed || 0) + 1;
    notifyAdmins(`Missed visit: ${c.name} at “${p.title}” (${c.missed} in a row).`, '#/properties');
    notifyOwners(p, `A scheduled visit to “${p.title}” was missed. Ops has been alerted.`, '#/p/' + p.id + '/reports');
    notify(c.id, `You missed the visit to “${p.title}”. Please contact ops.`, '#/');
    audit('inspection.missed', 'inspection', i.id, `caretaker ${c.id}, streak ${c.missed}`);
    const sb = S.subscriptions.find(s => s.id === i.subscriptionId);
    if (sb) { sb.end += 30 * DAY; audit('plan.credit', 'subscription', sb.id, '30-day credit for missed visit'); notifyOwners(p, `We added 30 days to your plan for “${p.title}” because a visit was missed.`); }
    if (c.missed >= S.config.missedThreshold) { notifyAdmins(`${c.name} reached the missed-visit threshold. Consider reassigning “${p.title}”.`, '#/properties'); }
    const a = activeAssign(p);
    if (a) { const due = t0 + DAY; S.inspections.push({ id: uid('insp'), propertyId: p.id, assignmentId: a.id, caretakerId: a.caretakerId, subscriptionId: i.subscriptionId, dueAt: due, windowEnd: due + 3 * DAY, status: 'scheduled', media: [], checklist: {}, flags: [], attempts: [] }); }
  }
  for (const sb of S.subscriptions) {
    const p = prop(sb.propertyId);
    if (sb.status === 'active' && sb.end < t0) { sb.status = 'grace'; sb.graceUntil = sb.end + S.config.graceDays * DAY; lapsed++; notifyOwners(p, `Your plan for “${p.title}” has ended. Renew within ${S.config.graceDays} days to keep visits going. Your data is safe.`); }
    else if (sb.status === 'grace' && sb.graceUntil < t0) { sb.status = 'paused'; notifyOwners(p, `Visits for “${p.title}” are paused. Nothing has been deleted; renew any time.`); }
  }
  audit('jobs.daily', 'system', '-', `missed ${missed}, plans lapsed ${lapsed}`);
  return { missed, lapsed };
}
function endAssignment(a, reason, handover) {
  a.status = 'ended'; a.endedAt = now(); a.endedReason = reason; a.handover = handover;
  const p = prop(a.propertyId);
  for (const i of S.inspections.filter(i => i.assignmentId === a.id && ['scheduled', 'in_progress'].includes(i.status))) i.status = 'reassigning';
  notifyOwners(p, `Your caretaker for “${p.title}” changed (${reason}). Ops will propose a replacement; all history is kept.`, '#/p/' + p.id);
  notify(a.caretakerId, `Your assignment at “${p.title}” has ended (${reason}).`);
  notifyAdmins(`Reassignment needed for “${p.title}”.`, '#/properties');
  audit('assignment.end', 'assignment', a.id, reason + (handover ? ' — handover: ' + handover : ''));
}

function propertyHealth(p) {
  const openInc = S.incidents.filter(i => i.propertyId === p.id && i.status !== 'resolved');
  const sb = subOf(p), last = lastPublished(p), nv = nextVisit(p);
  if (p.status === 'ownership_flagged') return { cls: 'bad', label: 'Ownership under admin review' };
  if (openInc.length) return { cls: 'bad', label: `${t('attention')}: ${openInc.length} open alert${openInc.length > 1 ? 's' : ''}` };
  if (!sb) { const au = liveAuction(p); if (au) { const n = visibleBids(au).length; return { cls: 'info', label: n ? `${n} caretaker bid${n > 1 ? 's' : ''} received` : 'Finding caretakers…' }; } return { cls: 'info', label: 'No care plan yet' }; }
  if (sb.status === 'paused') return { cls: 'bad', label: 'Visits paused — plan lapsed' };
  if (sb.status === 'grace') return { cls: 'warn', label: 'Plan ended — renew to continue' };
  if (S.inspections.some(i => i.propertyId === p.id && i.status === 'missed' && (!last || i.dueAt > last.dueAt))) return { cls: 'warn', label: 'A visit was missed' };
  if (!last) {
    if (activeAssign(p)) return { cls: 'info', label: t('noVisits') };
    const oa = openAssign(p);
    if (oa && oa.status === 'owner_approved' && p.status === 'verified') return { cls: 'info', label: `Waiting for ${user(oa.caretakerId).name.split(' ')[0]} to accept` };
    if (p.status === 'pending_verification') return { cls: 'warn', label: S.documents.some(d => d.propertyId === p.id) ? 'Verifying your documents' : 'Upload an ownership document' };
    if (oa && oa.status === 'proposed') return { cls: 'info', label: 'Approve your caretaker' };
    return { cls: 'info', label: 'Choose your caretaker' };
  }
  if (now() - last.submittedAt > 40 * DAY) return { cls: 'warn', label: 'Visit overdue' };
  if (nv && nv.windowEnd < now()) return { cls: 'warn', label: 'Visit overdue' };
  return { cls: 'ok', label: t('isOk') };
}

/* ---------------- simulated bidding (like ride apps) ----------------
   Owner names a price; nearby verified caretakers accept it, counter-bid, or decline.
   Bids are pre-computed with arrival times when the request starts, so the simulation
   is deterministic and survives page reloads. In production each caretaker bids live. */
const liveAuction = p => S.auctions.filter(a => a.propertyId === p.id && a.status === 'open').sort((a, b) => b.startedAt - a.startedAt)[0];
const visibleBids = a => a.bids.filter(b => b.at <= now()).sort((x, y) => x.amount - y.amount || x.at - y.at);
const auctionOpen = a => a.status === 'open' && now() < a.endsAt;
function fmtCountdown(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
const roundTo50 = minor => Math.round(minor / 5000) * 5000;
function bidLimits(listAmount) { return { min: roundTo50(listAmount * S.config.minOfferPct / 100), max: roundTo50(listAmount * 1.5) }; }
function startAuction(p, tier, offer, round) {
  const list = S.config.prices[tier][p.type], t0 = now(), dur = S.config.auctionSeconds * 1000;
  const a = { id: uid('auc'), propertyId: p.id, ownerId: me().id, tier, listAmount: list, offer, round: round || 1, startedAt: t0, endsAt: t0 + dur, status: 'open', bids: [], declined: [] };
  const cands = matchCandidates(p).filter(x => x.eligible);
  a.inRange = cands.length;
  cands.forEach((x, n) => {
    // Each caretaker's private asking price: better-rated and farther caretakers ask more.
    const ask = list * (0.82 + Math.max(0, x.rating - 4) * 0.3 + x.d * 0.012 + (Math.random() * 0.12 - 0.06));
    const at = t0 + 1500 + Math.random() * dur * 0.7;
    if (offer >= ask) a.bids.push({ id: uid('bid'), caretakerId: x.c.id, amount: offer, at, kind: 'accepted', eta: 1 + Math.floor(Math.random() * 3), auto: true });
    else if (ask <= offer * 1.35) a.bids.push({ id: uid('bid'), caretakerId: x.c.id, amount: roundTo50(ask), at, kind: 'counter', eta: 1 + Math.floor(Math.random() * 4), auto: true });
    else a.declined.push({ caretakerId: x.c.id, at, reason: 'offer below their minimum' });
  });
  S.auctions.push(a);
  audit('auction.start', 'auction', a.id, `${tier} offer ${money(offer)} (list ${money(list)}), ${cands.length} caretakers in range`);
  if (!cands.length) notifyAdmins(`Bid request for “${p.title}” found no caretaker in range.`, '#/properties');

function auctionSig(a) { return [a.status, auctionOpen(a), visibleBids(a).map(b => b.id + b.amount).join(','), a.declined.filter(x => x.at <= now()).length].join('|'); }

  const p = prop(a.propertyId), bids = visibleBids(a), open = auctionOpen(a);
  const declined = a.declined.filter(x => x.at <= now()).length;
  const best = bids[0];
  const lim = bidLimits(a.listAmount);
  const canAct = canApprove(u, p);
  return `<div id="auction-panel" data-id="${a.id}" data-sig="${esc(auctionSig(a))}">
    <div class="row" style="gap:14px"><div class="radar ${open ? '' : 'done'}" aria-hidden="true"></div>
      <div style="flex:1;min-width:200px"><h3 style="margin:0">${open ? 'Finding caretakers near your property…' : bids.length ? 'Bidding closed — pick a caretaker' : 'No bids this round'}</h3>
        <p class="small muted" style="margin:.2em 0 0">${TIERS[a.tier].name} plan · your offer <strong>${money(a.offer)}</strong>/year (list ${money(a.listAmount)}) · round ${a.round}
        ${open ? ` · closes in <span class="countdown" data-countdown="${a.endsAt}">${fmtCountdown(a.endsAt - now())}</span>` : ''}</p></div>
      <span class="pill ${open ? 'info' : 'warn'}">${bids.length} bid${bids.length === 1 ? '' : 's'}${declined ? ` · ${declined} declined` : ''}</span></div>
    <div aria-live="polite">${bids.length ? bids.map(b => { const c = user(b.caretakerId), r = c.ratingCount ? c.ratingSum / c.ratingCount : 0, d = c.center ? distM(c.center, p) : 0;
      const diff = Math.round((b.amount - a.offer) / a.offer * 100);
      return `<div class="bid ${b.at > now() - 1600 ? 'new' : ''} ${b === best ? 'best' : ''}"><span class="av">${avatar(c)}</span>
        <div><strong>${esc(c.name)}</strong> ${b === best ? pill('ok', 'Lowest') : ''}<div class="small muted">${stars(r)} ${r ? r.toFixed(1) : 'new'} (${c.ratingCount}) · ${(d / 1000).toFixed(1)} km away · first visit in ${b.eta} day${b.eta > 1 ? 's' : ''}</div>

function getLocation(p) {
  const mode = S.demo.locMode;
  if (mode === 'gps') return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('GPS not available'));
    navigator.geolocation.getCurrentPosition(pos => res({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy }), e => rej(new Error(e.message || 'GPS permission denied')), { enableHighAccuracy: true, timeout: 15000 });
  });
  const meters = { pin: 6, near: 40, far: 5000 }[mode] ?? 40;
  return Promise.resolve({ ...offsetPoint(p, meters + Math.random() * 6, Math.random() * 360), acc: 8 + Math.random() * 8 });
}

/* ---------------- payment modal (simulated) ---------------- */
function payModal(u, amount, label, onSuccess) {
  const intl = u.country && u.country !== 'IN';
  modal(`<h2>Pay ${money(amount)}</h2><p class="muted">${esc(label)}</p>
  <div class="banner warn">Test mode — simulated payment. No money moves. Gateway choice is still open.</div>
  <form data-form="payNow" class="stack">
    <fieldset><legend><strong>Method</strong></legend>
      ${['UPI', 'Card (India)', 'International card', 'Net banking'].map((m, i) => `<label class="check"><input type="radio" name="method" value="${m}" ${(intl ? m === 'International card' : i === 0) ? 'checked' : ''}> ${m}</label>`).join('')}</fieldset>
    ${intl ? `<p class="small muted">You'll be charged in INR. Your card issuer converts it to your currency and may add fees.</p>` : ''}
    <div class="row"><button class="btn primary" name="result" value="ok">Simulate success</button><button class="btn danger" name="result" value="fail">Simulate failure</button><button type="button" class="btn ghost" data-act="closeModal">Cancel</button></div>
  </form>`);
  FORMS._pay = (fd, f, submitter) => {
    const result = submitter ? submitter.value : 'ok';
    closeModal();
    if (result === 'fail') { audit('payment.failed', 'payment', '-', label); toast('Payment failed (simulated). Nothing was charged; you can try again.', 'bad'); notify(u.id, `Payment of ${money(amount)} failed — please try again.`); render(); return; }
    onSuccess(fd.get('method'));
    render();
  };
}

/* ---------------- event handling ---------------- */
const ACTIONS = {
  modalBack: (d, el, e) => { if (e.target === el) closeModal(); },
  closeModal: () => closeModal(),
  signIn: d => { S.session = d.id; audit('auth.signin', 'user', d.id, 'demo sign-in'); go('#/'); },
  signOut: () => { audit('auth.signout', 'user', S.session, ''); S.session = null; go('#/'); },
  cancelSignup: () => { pendingSignup = null; render(); },
  lang: () => { S.lang = S.lang === 'en' ? 'bn' : 'en'; render(); },
  theme: () => { const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; S.theme = dark ? 'light' : 'dark'; render(); },
  resetDemo: () => { if (!confirm('Reset all demo data in this browser?')) return; localStorage.removeItem(STORE_KEY); seed(); location.hash = '#/'; render(); toast('Demo data reset'); },

  /* plans & negotiation */
  buyPlan: d => {
    const u = me(), p = prop(d.prop), list = S.config.prices[d.tier][p.type];
    const req = d.req ? S.priceRequests.find(r => r.id === d.req) : null;
    const amount = req ? req.agreed : list;
    payModal(u, amount, `${TIERS[d.tier].name} care plan for “${p.title}” — 1 year`, method => {
      const sb = { id: uid('sub'), propertyId: p.id, tier: d.tier, amount, listAmount: list, start: now(), end: now() + 365 * DAY, status: 'active', installments: S.config.installments, released: 0, paidBy: u.id };
      S.subscriptions.push(sb);
      recordPayment({ ownerId: u.id, propertyId: p.id, purpose: 'plan', refId: sb.id, amount, method, presentment: method === 'International card' ? 'Charged in INR' : '' });
      if (req) req.status = 'paid';
      audit('plan.purchase', 'subscription', sb.id, `${d.tier} ${money(amount)}`);
      notifyOwners(p, `Your ${TIERS[d.tier].name} plan for “${p.title}” is active. Choose your caretaker on the property page.`);
      notifyAdmins(`New ${TIERS[d.tier].name} plan for “${p.title}” — needs matching${p.status !== 'verified' ? ' after verification' : ''}.`, '#/properties');
      toast('Payment successful (simulated). Plan active.');
    });
  },
  renewPlan: d => {
    const u = me(), old = S.subscriptions.find(s => s.id === d.id), p = prop(old.propertyId);
    payModal(u, old.amount, `Renew ${TIERS[old.tier].name} for “${p.title}”`, method => {
      old.status = 'expired';
      const sb = { ...old, id: uid('sub'), start: now(), end: now() + 365 * DAY, status: 'active', released: 0 };
      S.subscriptions.push(sb);
      recordPayment({ ownerId: u.id, propertyId: p.id, purpose: 'plan', refId: sb.id, amount: sb.amount, method });
      for (const i of S.inspections.filter(i => i.subscriptionId === old.id && ['scheduled', 'in_progress'].includes(i.status))) i.subscriptionId = sb.id;
      scheduleNext(p, now() - 29 * DAY);
      toast('Plan renewed (simulated payment).');
    });
  },
  proposePrice: d => {
    const p = prop(d.prop), list = S.config.prices[d.tier][p.type];
    modal(`<h2>Propose a price</h2><p class="muted">${TIERS[d.tier].name} for “${esc(p.title)}” — list price ${money(list)}/year. Ops will accept, counter or decline.</p>
      <form data-form="proposePrice" data-prop="${p.id}" data-tier="${d.tier}" class="stack"><label for="pp-a">Your proposed yearly price (₹)</label><input id="pp-a" name="amount" required inputmode="decimal">
      <label for="pp-n">Reason (optional)</label><input id="pp-n" name="note" placeholder="e.g. two properties in the same locality"><div class="row"><button class="btn primary">Send to ops</button><button type="button" class="btn ghost" data-act="closeModal">Cancel</button></div></form>`);
  },
  acceptCounter: d => { const r = S.priceRequests.find(x => x.id === d.id); r.status = 'accepted'; r.agreed = r.counter; audit('price.accept_counter', 'price_request', r.id, money(r.agreed)); notifyAdmins(`Owner accepted ${money(r.agreed)} for “${prop(r.propertyId).title}”.`); render(); },
  declineCounter: d => { const r = S.priceRequests.find(x => x.id === d.id); r.status = 'declined'; audit('price.decline_counter', 'price_request', r.id, ''); render(); },
  acceptPrice: d => { const r = S.priceRequests.find(x => x.id === d.id); r.status = 'accepted'; r.agreed = r.proposed; audit('price.accept', 'price_request', r.id, money(r.agreed)); notify(r.ownerId, `Ops accepted your price of ${money(r.agreed)} for “${prop(r.propertyId).title}”. You can pay now.`, '#/p/' + r.propertyId); render(); },
  declinePrice: d => { const r = S.priceRequests.find(x => x.id === d.id); r.status = 'declined'; audit('price.decline', 'price_request', r.id, ''); notify(r.ownerId, `Ops couldn't accept your proposed price for “${prop(r.propertyId).title}”. List price still applies.`, '#/p/' + r.propertyId); render(); },

  /* bidding */
  openBidForm: d => {
    const p = prop(d.prop), list = S.config.prices[d.tier][p.type], lim = bidLimits(list);
    const chip = pct => `<button type="button" class="btn sm" data-act="bidChip" data-v="${roundTo50(list * pct) / 100}">${pct === 1 ? 'List price' : (pct > 1 ? '+' : '−') + Math.round(Math.abs(pct - 1) * 100) + '%'}</button>`;
    modal(`<h2>Get caretaker bids</h2><p class="muted">${TIERS[d.tier].name} plan for “${esc(p.title)}”. Name your yearly price; verified caretakers near your pin will accept it or counter-bid within ${S.config.auctionSeconds} seconds (simulated).</p>
      <form data-form="startAuction" data-prop="${p.id}" data-tier="${d.tier}" class="stack">
        <label for="ba-amt">Your offer (₹ per year)</label><input id="ba-amt" name="amount" inputmode="decimal" required value="${list / 100}">

        <p class="hint">Suggested ${money(list)} · allowed ${money(lim.min)} – ${money(lim.max)} · ${matchCandidates(p).filter(x => x.eligible).length} verified caretakers cover this pin.</p>
        <div class="row"><button class="btn primary">Find caretakers</button><button type="button" class="btn ghost" data-act="closeModal">Cancel</button></div></form>`);
  },
  bidChip: d => { const el = $('#ba-amt'); if (el) el.value = d.v; },
  cancelAuction: d => { const a = S.auctions.find(x => x.id === d.id); a.status = 'cancelled'; audit('auction.cancel', 'auction', a.id, ''); render(); },
  acceptBid: d => {
    const a = S.auctions.find(x => x.id === d.auction), b = a.bids.find(x => x.id === d.bid), p = prop(a.propertyId), u = me(), c = user(b.caretakerId);

    payModal(u, b.amount, `${TIERS[a.tier].name} plan for “${p.title}” with ${c.name} — 1 year at the bid price`, method => {
      const sb = { id: uid('sub'), propertyId: p.id, tier: a.tier, amount: b.amount, listAmount: a.listAmount, start: now(), end: now() + 365 * DAY, status: 'active', installments: S.config.installments, released: 0, paidBy: u.id, via: 'bid', auctionId: a.id };
      S.subscriptions.push(sb);
      recordPayment({ ownerId: u.id, propertyId: p.id, purpose: 'plan', refId: sb.id, amount: b.amount, method, presentment: method === 'International card' ? 'Charged in INR' : '' });
      a.status = 'accepted'; a.winner = b.id; a.acceptedAt = now();
      const as = { id: uid('as'), propertyId: p.id, caretakerId: c.id, status: 'owner_approved', proposedAt: now(), ownerDecisionAt: now(), score: 0, explain: `won bid at ${money(b.amount)}`, requestedByOwner: true, viaBid: true };
      S.assignments.push(as);
      audit('auction.accept', 'auction', a.id, `${c.name} at ${money(b.amount)}`);
      if (p.status === 'verified') activateAssignment(as);
      else notify(c.id, `You won the bid for a ${p.type} in ${p.region} at ${money(b.amount)}/year. It starts once ops verifies the owner's documents.`, '#/');
      visibleBids(a).filter(x => x.id !== b.id).forEach(x => notify(x.caretakerId, `The owner chose another caretaker for the ${p.type} in ${p.region}.`));
      notifyAdmins(`Bid accepted: ${c.name} for “${p.title}” at ${money(b.amount)}${p.status === 'verified' ? '' : ' (pending verification)'}.`, '#/properties');
      toast(p.status === 'verified' ? `${c.name} is assigned. First visit scheduled.` : `${c.name} is booked. Starts as soon as ops verifies your documents.`);
    });
  },
  acceptOffer: d => { const a = S.auctions.find(x => x.id === d.auction); placeBid(a, a.offer, 'accepted'); },

  /* assignments */
  proposeAssign: d => {
    const p = prop(d.prop), c = user(d.care);

function placeBid(a, amount, kind) {
  const u = me(), p = prop(a.propertyId);
  if (!auctionOpen(a)) { toast('This request has closed.', 'warn'); render(); return; }
  if (u.status !== 'active' || !matchCandidates(p).some(x => x.c.id === u.id && x.eligible)) { toast('You are not eligible for this property.', 'bad'); return; }
  a.bids = a.bids.filter(b => b.caretakerId !== u.id);
  a.declined = a.declined.filter(x => x.caretakerId !== u.id);
  a.bids.push({ id: uid('bid'), caretakerId: u.id, amount, at: now(), kind, eta: 1, auto: false });
  audit('auction.bid', 'auction', a.id, `${u.name} ${money(amount)}`);
  notifyOwners(p, `New bid from ${u.name}: ${money(amount)}/year for “${p.title}”.`, '#/p/' + p.id);
  toast('Bid sent to the owner.'); render();
}
function addShot(inspId, dataUrl, source) {
  const i = S.inspections.find(x => x.id === inspId) || null;
  const tk = i ? null : S.tickets.find(x => x.id === inspId);
  const p = prop((i || tk).propertyId);
  return getLocation(p).then(loc => {
    const m = { id: uid('m'), data: dataUrl, hash: hash(dataUrl), lat: loc.lat, lng: loc.lng, dist: distM(loc, p), deviceAt: deviceNow(), serverAt: S.demo.offline ? null : now(), perf: performance.now(), source, flags: [], nonce: i ? i.nonce : 'ticket' };
    if (i) { if (!i.nonce) { toast('Check in first.', 'bad'); return; } i.media.push(m); }
    else tk.proof.push(m);
    audit('media.capture', i ? 'inspection' : 'ticket', inspId, `${source}, ${fmtDist(m.dist)} from pin`);
    if (!$('.modal')) render();
  }).catch(e => toast('Location error: ' + e.message, 'bad'));
}
async function openCamera(id) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Camera not available here — use Demo capture.', 'warn'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); }
  catch (e) { toast('Camera blocked or unavailable — use Demo capture.', 'warn'); return; }
  modal(`<h2>${t('takePhoto')}</h2><video id="cam" autoplay playsinline muted style="width:100%;border-radius:12px;background:#000"></video>
    <div class="seg" style="margin-top:10px"><button class="btn primary big" data-act="snap" data-id="${id}">📷 Capture</button><button class="btn big" data-act="closeModal">Done</button></div>
    <p class="small muted">Photos are taken live in the app. Gallery photos are not accepted as evidence.</p>`, () => { stream.getTracks().forEach(tr => tr.stop()); render(); });
  $('#cam').srcObject = stream;
}
ACTIONS.snap = d => { const v = $('#cam'); if (!v || !v.videoWidth) { toast('Camera is still starting…', 'warn'); return; } addShot(d.id, compressFrame(v), 'camera'); toast('Photo captured'); };

function finishInspection(i, p) {
  // Offline captures: reconstruct capture time from the last server sync + monotonic elapsed time.
  const ls = S.demo.lastSync;
  for (const m of i.media.concat(i.checkin ? [i.checkin] : [])) {
    if (!m.serverAt) {
      if (ls && m.perf && m.perf >= ls.perf) m.reconstructedAt = ls.serverAt + (m.perf - ls.perf);
      else m.timeUnverifiable = true;
      m.serverAt = now();
    }
  }
  i.flags = integrityCheck(i, p);
  i.submittedAt = now();
  if (i.flags.length) {
    i.status = 'flagged';
    audit('inspection.flagged', 'inspection', i.id, i.flags.map(f => f.code).join(','));
    notifyAdmins(`Visit report flagged at “${p.title}”: ${i.flags.map(f => f.text).join('; ')}`, '#/review');
    toast('Report sent for review — some checks failed.', 'warn');
  } else {
    audit('inspection.published', 'inspection', i.id, '');
    publishInspection(i);
    toast('Report published. Owner notified. Payout milestone eligible.');
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' && el.type === 'submit' && el.form) return;
  if (el.dataset.act !== 'modalBack') e.preventDefault();
  try { const r = fn({ ...el.dataset }, el, e); if (r && r.catch) r.catch(err => { console.error(err); toast(err.message, 'bad'); }); save(); }
  catch (err) { console.error(err); toast(err.message, 'bad'); }
});
document.addEventListener('submit', e => {
  const f = e.target; const fn = FORMS[f.dataset.form]; if (!fn) return;
  e.preventDefault();
  try { fn(new FormData(f), f, e.submitter); save(); } catch (err) { console.error(err); toast(err.message, 'bad'); }
});

function tickLive() {
  if (!S || !me()) return;
  document.querySelectorAll('[data-countdown]').forEach(el => { const ms = +el.dataset.countdown - now(); el.textContent = ms > 0 ? fmtCountdown(ms) : 'closed'; });
  const panel = document.getElementById('auction-panel');
  if (panel) {
    const a = S.auctions.find(x => x.id === panel.dataset.id);
    const typing = document.activeElement && document.activeElement.tagName === 'INPUT' && panel.contains(document.activeElement);
    if (a && auctionSig(a) !== panel.dataset.sig && !typing) {
      const wrap = document.createElement('div'); wrap.innerHTML = auctionPanel(me(), a); panel.replaceWith(wrap.firstElementChild);
    }
  }
  const req = document.getElementById('bid-requests');
  // When a request near this caretaker closes, refresh the list (unless they're typing a bid).
  if (req && !req.contains(document.activeElement) && S.auctions.some(a => a.status === 'open' && now() >= a.endsAt && now() - a.endsAt < 1100)) render();
}
window.addEventListener('DOMContentLoaded', () => {
  S = load();
  if (!S) seed();
  migrate();
  render();
